server:
  # Bind to the platform-provided port when present (e.g. Render sets $PORT); 8080 everywhere else.
  port: ${PORT:8080}

spring:
  application:
    name: personal-finance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      # Keep actuator under /api so it matches the security allow-list (/api/actuator/**) and the
      # reverse-proxy /api forwarding. Health check: GET /api/actuator/health.
      base-path: /api/actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
