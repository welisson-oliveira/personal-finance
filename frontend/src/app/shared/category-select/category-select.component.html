<mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
  <mat-label>{{ label }}</mat-label>
  <mat-select [value]="value" (selectionChange)="onSelectionChange($event.value)" (closed)="onPanelClosed()">
    <div class="category-search" (click)="$event.stopPropagation()">
      <mat-icon>search</mat-icon>
      <input type="text" [(ngModel)]="search" placeholder="Buscar categoria..." (keydown)="$event.stopPropagation()" />
    </div>

    <mat-option value="">Nenhuma</mat-option>
    @for (cat of filtered; track cat.id) {
      <mat-option [value]="cat.id">
        <mat-icon class="option-icon" [style.color]="cat.color || null">{{ cat.icon || 'label' }}</mat-icon>
        {{ cat.name }}
      </mat-option>
    }
    @if (filtered.length === 0) {
      <div class="no-results">Nenhuma categoria encontrada</div>
    }
  </mat-select>
</mat-form-field>
