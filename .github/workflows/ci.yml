name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Check formatting (Spotless)
        run: ./mvnw spotless:check -B

      - name: Run tests
        run: ./mvnw test -B

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

  # Triggers the Render deploy ONLY after all checks pass on a push to main (i.e. a release
  # merge). Requires the repo secret RENDER_DEPLOY_HOOK (Render → service → Settings → Deploy Hook).
  # With this in place, turn OFF Render's own Auto-Deploy so deploys aren't triggered twice.
  deploy:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All checks green on main (${GITHUB_SHA}); triggering Render deploy..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Render deploy triggered."
