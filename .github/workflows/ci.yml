name: CI

on:
  # Push builds only on the long-lived branches; feature branches are covered by their PR run below,
  # so a branch with an open PR no longer runs CI twice.
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

# Supersede in-flight runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Check formatting (Spotless)
        run: ./mvnw spotless:check -B

      - name: Run tests
        run: ./mvnw test -B

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker-compose.ci.yml adds GitHub Actions layer cache (type=gha) so unchanged layers are
      # reused across runs. COMPOSE_BAKE routes the build through buildx bake, which honors cache_to.
      - name: Build images (with layer cache)
        env:
          COMPOSE_BAKE: "true"
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build
