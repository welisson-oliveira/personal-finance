name: CI

on:
  # CI roda no push do develop (pra gerar o candidato) e nos PRs. NÃO roda no push da main: a main só
  # é alcançada via PR de release, que já foi validado como PR — re-rodar no commit de merge seria só
  # rebuildar/retestar exatamente o mesmo código. O Deploy é o único workflow que dispara no merge.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

# Supersede in-flight runs for the same branch/PR when new commits arrive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Só em PR. No merge (push no develop) NÃO re-roda: a branch protection já exigiu Backend verde pra
    # mergear, então o código integrado já foi validado — re-testar seria a duplicação PR↔merge.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Check formatting (Spotless)
        run: ./mvnw spotless:check -B

      - name: Run tests
        run: ./mvnw test -B

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # Só em PR (mesmo motivo do Backend): no merge não re-roda.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Só em PR para develop. Não roda em push (já foi checado no PR) nem em PR de release para main
    # (o Deploy builda a imagem de verdade logo após o merge). O Dockerfile já foi validado no candidato.
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker-compose.ci.yml adds GitHub Actions layer cache (type=gha) so unchanged layers are
      # reused across runs. COMPOSE_BAKE routes the build through buildx bake, which honors cache_to.
      - name: Build images (with layer cache)
        env:
          COMPOSE_BAKE: "true"
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

  # PR guard (trava de versão): em PRs para develop, falha se a versão do pom já tem tag/release. Força
  # cada PR a subir backend/pom.xml para uma versão nova — dois merges nunca compartilham a mesma tag.
  # Torne este check REQUIRED na branch protection do develop para ele de fato bloquear o merge.
  version-check:
    name: Version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Falhar se a versão do pom já tem tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('backend/pom.xml').getroot(); ns={'m':r.tag[r.tag.find('{')+1:r.tag.find('}')]}; print(r.find('m:version',ns).text)")
          V=${V%-SNAPSHOT}
          echo "Versão do pom: $V"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::error::A versão $V já tem release/tag. Suba backend/pom.xml para a próxima versão (X.Y.Z-SNAPSHOT) neste PR."
            exit 1
          fi
          echo "OK — $V ainda não tem tag."

  # Candidato: publica um pre-release marcando o develop, mas SÓ com o CI inteiro verde (needs). A tag é
  # apenas o número da versão (sem v/rc/.n). O deploy depois PROMOVE esse pre-release a release final.
  candidate:
    name: Publish candidate
    runs-on: ubuntu-latest
    # Roda sozinho no push do develop, SEM re-rodar os testes. A validação é a branch protection do
    # develop (exige Backend+Frontend verdes pra mergear), então o commit integrado já é confiável.
    # Recomendado ligar "Require branches to be up to date before merging" pra fechar a brecha de o
    # develop ter avançado entre o CI do PR e o merge.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write # required to create the GitHub Release/tag

    steps:
      - uses: actions/checkout@v4

      - name: Read version from pom.xml
        id: ver
        run: |
          # Direct child <version> of <project> (not the Spring Boot parent's), with -SNAPSHOT stripped.
          # Parsed with python3 (always on the runner) because ubuntu-latest no longer ships xmllint.
          V=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('backend/pom.xml').getroot(); ns={'m':r.tag[r.tag.find('{')+1:r.tag.find('}')]}; print(r.find('m:version',ns).text)")
          V=${V%-SNAPSHOT}
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Project version: $V"

      - name: Publicar candidato (pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          # Tag = a versão, sem v/rc/.n. Se já existir (versão reusada — o version-check deveria ter
          # pego), falha pedindo bump. É o backstop da trava caso dois PRs corram.
          if gh release view "$V" >/dev/null 2>&1; then
            echo "::error::A versão $V já tem release/tag. Suba backend/pom.xml antes de mergear no develop."
            exit 1
          fi
          echo "Criando candidato $V em ${GITHUB_SHA}"
          gh release create "$V" \
            --title "$V" \
            --notes "Candidato — snapshot de \`develop\` em ${GITHUB_SHA} (CI verde)." \
            --prerelease \
            --target "${GITHUB_SHA}"
