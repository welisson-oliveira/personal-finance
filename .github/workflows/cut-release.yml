name: Cut Release

# Promove um release candidate para um PR de release. Por padrão promove o RC MAIS RECENTE — é só
# clicar "Run workflow" e deixar o campo vazio (nada pra digitar). Cria a branch release/<versão>
# apontando para o COMMIT EXATO do RC e abre um PR para main.
#
# Como a branch aponta para o commit do RC (que já passou no CI), os mesmos check runs "Backend"/
# "Frontend" já estão verdes nesse SHA — a branch protection do main os enxerga sem reexecutar. Ao
# mergear o PR, o workflow Deploy builda/pusha a imagem e sobe no Render.
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Deixe VAZIO para promover o RC mais recente. Ou informe uma tag específica (ex. v0.0.1-rc.365)."
        required: false
        type: string

jobs:
  cut-release:
    name: Criar branch de release e abrir PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a branch release/*
      pull-requests: write # abrir o PR para main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico e dos tags para resolver o RC

      - name: Resolver o RC e derivar a versão
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_INPUT: ${{ inputs.rc_tag }}
        run: |
          RC="$RC_INPUT"
          if [ -z "$RC" ]; then
            # Nada digitado: pega a pré-release (RC) mais recente publicada.
            RC=$(gh release list --limit 40 --json tagName,isPrerelease,createdAt \
                 --jq 'map(select(.isPrerelease and (.tagName|test("-rc\\.[0-9]+$")))) | sort_by(.createdAt) | last | .tagName')
            if [ -z "$RC" ] || [ "$RC" = "null" ]; then
              echo "::error::Nenhum RC (pré-release vX.Y.Z-rc.N) encontrado para promover."
              exit 1
            fi
            echo "Nenhuma tag informada → promovendo o RC mais recente: $RC"
          fi
          if [[ ! "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "::error::'$RC' não parece um tag de RC (esperado: vX.Y.Z-rc.N)."
            exit 1
          fi
          VERSION="${RC#v}"          # 0.0.1-rc.365
          VERSION="${VERSION%-rc.*}" # 0.0.1
          SHA=$(git rev-list -n1 "$RC") || { echo "::error::Tag $RC não encontrado no repositório."; exit 1; }
          {
            echo "rc=$RC"
            echo "version=$VERSION"
            echo "branch=release/$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Promovendo $RC → versão $VERSION → branch release/$VERSION @ $SHA"

      - name: Falhar se a versão já foi deployada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # A release final é criada só no deploy. Se v<versão> já existe, essa versão já foi para
          # produção — promover de novo é erro. Suba a versão no pom antes.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION já foi deployada em produção. Suba a versão no pom (ex. próxima MINOR/PATCH) antes de promover."
            exit 1
          fi

      - name: Criar branch de release no commit do RC
        env:
          BRANCH: ${{ steps.v.outputs.branch }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::A branch $BRANCH já existe. Apague-a ou promova outra versão."
            exit 1
          fi
          git push origin "$SHA:refs/heads/$BRANCH"
          echo "Branch $BRANCH criada em $SHA."

      - name: Abrir PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.v.outputs.rc }}
          BRANCH: ${{ steps.v.outputs.branch }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > pr-body.md <<EOF
          Promove o RC \`$RC\` para produção.

          Ao **mergear** este PR, o workflow **Deploy** builda a imagem \`$VERSION\`, publica no ghcr, sobe no Render e, quando \`live\`, publica a Release \`v$VERSION\`.

          - Cortado do commit exato do RC (mesmo SHA já validado no CI).
          - Pré-requisito: setup do Render pronto — ver \`docs/deploy.md\`.
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: v$VERSION" \
            --body-file pr-body.md
