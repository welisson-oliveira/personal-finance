name: Cut Release

# Promove um candidato para um PR de release. Por padrão promove o candidato MAIS RECENTE — é só
# clicar "Run workflow" e deixar o campo vazio (nada pra digitar). Cria a branch release/<versão>
# apontando para o COMMIT EXATO do candidato e abre um PR para main.
#
# Como a branch aponta para o commit do candidato (que já passou no CI), os mesmos check runs
# "Backend"/"Frontend" já estão verdes nesse SHA — a branch protection do main os enxerga sem
# reexecutar. Ao mergear o PR, o workflow Deploy builda/pusha a imagem e sobe no Render.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Deixe VAZIO para promover o candidato mais recente. Ou informe uma versão (ex. 0.0.1)."
        required: false
        type: string

jobs:
  cut-release:
    name: Criar branch de release e abrir PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a branch release/*
      pull-requests: write # abrir o PR para main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico e dos tags para resolver o candidato

      - name: Resolver o candidato
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            # Nada digitado: pega o candidato (pré-release) mais recente publicado.
            VERSION=$(gh release list --limit 40 --json tagName,isPrerelease,createdAt \
                      --jq 'map(select(.isPrerelease)) | sort_by(.createdAt) | last | .tagName')
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "::error::Nenhum candidato (pré-release) encontrado para promover."
              exit 1
            fi
            echo "Nada informado → promovendo o candidato mais recente: $VERSION"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' não é uma versão válida (esperado: X.Y.Z)."
            exit 1
          fi
          SHA=$(git rev-list -n1 "$VERSION") || { echo "::error::Tag $VERSION não encontrado no repositório."; exit 1; }
          {
            echo "version=$VERSION"
            echo "branch=release/$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Promovendo $VERSION @ $SHA → branch release/$VERSION"

      - name: Falhar se a versão já foi deployada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Um candidato é pré-release (esperado). Se a tag já for release FINAL, a versão já foi para
          # produção — promover de novo é erro. Suba a versão no pom antes.
          if [ "$(gh release view "$VERSION" --json isPrerelease -q .isPrerelease 2>/dev/null)" = "false" ]; then
            echo "::error::$VERSION já foi deployada em produção. Suba a versão no pom antes de promover."
            exit 1
          fi

      - name: Criar branch de release no commit do candidato
        env:
          BRANCH: ${{ steps.v.outputs.branch }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::A branch $BRANCH já existe. Apague-a ou promova outra versão."
            exit 1
          fi
          git push origin "$SHA:refs/heads/$BRANCH"
          echo "Branch $BRANCH criada em $SHA."

      - name: Abrir PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.v.outputs.branch }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > pr-body.md <<EOF
          Promove o candidato \`$VERSION\` para produção.

          Ao **mergear** este PR, o workflow **Deploy** builda a imagem \`$VERSION\`, publica no ghcr, sobe no Render e, quando \`live\`, promove o candidato à Release final \`$VERSION\`.

          - Cortado do commit exato do candidato (mesmo SHA já validado no CI).
          - Pré-requisito: setup do Render pronto — ver \`docs/deploy.md\`.
          EOF
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: $VERSION" \
            --body-file pr-body.md
