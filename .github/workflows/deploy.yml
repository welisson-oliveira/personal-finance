name: Deploy

# Production deploy gate: fires ONLY when a release/* branch is merged into main. Any other merge into
# main (hotfix, direct commit, etc.) does NOT deploy.
#
# On a real release merge it:
#   1. Builds the backend image and pushes it to GitHub Container Registry (ghcr.io) with the IMMUTABLE
#      version tag from backend/pom.xml (e.g. 0.0.1) plus :latest.
#   2. Tells Render to deploy that exact image via the Render API and WAITS until it is live.
#   3. Only after a healthy, live deploy, publishes the final GitHub Release v<version>.
#
# Render runs the BACKEND only. If the deploy fails its health check, Render keeps the previous version
# live (zero-downtime), the run goes red, and no Release is published — prod is untouched. Use the
# Rollback workflow to redeploy an earlier immutable tag.
#
# One-time setup:
#   - Repo secrets: RENDER_API_KEY, RENDER_SERVICE_ID (backend service id, e.g. srv-xxxx).
#   - Render service type: "Deploy an existing image from a registry". Add a Registry Credential
#     (GitHub PAT with read:packages) so Render can pull the private ghcr image.
#   - Render Health Check Path: /api/actuator/health  (enables the auto-rollback described above).
#   - Turn Render Auto-Deploy OFF — this workflow is the only trigger.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push & deploy backend (Render)
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    permissions:
      contents: write # publish the final GitHub Release/tag
      packages: write # push the image to ghcr.io

    env:
      REGISTRY: ghcr.io

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version from pom.xml
        id: ver
        run: |
          # Direct child <version> of <project> (not the Spring Boot parent's), with -SNAPSHOT stripped.
          # Parsed with python3 (always on the runner) because ubuntu-latest no longer ships xmllint.
          V=$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('backend/pom.xml').getroot(); ns={'m':r.tag[r.tag.find('{')+1:r.tag.find('}')]}; print(r.find('m:version',ns).text)")
          V=${V%-SNAPSHOT}
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Deploying version: $V"

      - name: Compute image name
        id: img
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${REGISTRY}/${OWNER}/personal-finance-backend" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.img.outputs.backend }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.backend }}:latest
          # Só LÊ o cache (o CI já popula via type=gha). Escrever aqui (cache-to) disputava o mesmo
          # cache do job Docker do CI e derrubava o deploy com "failed to reserve cache" — depois de
          # a imagem já ter sido publicada. Ler é inofensivo; um miss só rebuilda.
          cache-from: type=gha

      - name: Deploy image on Render & wait for live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          IMAGE: ${{ steps.img.outputs.backend }}:${{ steps.ver.outputs.version }}
        run: bash .github/scripts/render-deploy.sh

      - name: Publish final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Promoted from \`${{ github.event.pull_request.head.ref }}\` (PR #${{ github.event.pull_request.number }}). Image \`${{ steps.img.outputs.backend }}:${{ steps.ver.outputs.version }}\` is live on Render." \
              --target main
          fi
